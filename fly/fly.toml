app = "claude-browser-javier"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  RESOLUTION = "1280x800x24"
  DATA_DIR = "/data"

# ACCESS_PASS se configura como secret:
#   fly secrets set ACCESS_PASS=tu_contrasena_segura

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
    tls_options = { alpn = ["h2", "http/1.1"] }

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[metrics]
  port = 9091
  path = "/metrics"

[[mounts]]
  source = "claude_data"
  destination = "/data"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
